<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 56" width="100%" height="auto" style="max-width: 600px;" fill="none">
  <defs>
    <!-- Card background gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160B2B" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0D0618" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#160B2B" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glowing border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957E5" stop-opacity="0.2"/>
      <stop offset="25%" stop-color="#A855F7" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#C084FC" stop-opacity="1"/>
      <stop offset="75%" stop-color="#A855F7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8957E5" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Subtle glow filter -->
    <filter id="badgeGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="596" height="52" rx="10" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.2"/>

  <!-- Cybernetic Corner Accents -->
  <path d="M 8 16 L 8 8 L 16 8" stroke="#C084FC" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 592 16 L 592 8 L 584 8" stroke="#C084FC" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 8 40 L 8 48 L 16 48" stroke="#8957E5" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 592 40 L 592 48 L 584 48" stroke="#8957E5" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Status Indicator Dot -->
  <circle cx="28" cy="28" r="4" fill="#A855F7" filter="url(#badgeGlow)"/>
  <circle cx="28" cy="28" r="2" fill="#F3E8FF"/>

  <!-- Main Identity Text -->
  <text x="44" y="25" fill="#F3E8FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">
    HAZZE'ON DIGITAL AGENCY
  </text>

  <!-- Subtitle Text -->
  <text x="44" y="41" fill="#B8A6D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" letter-spacing="0.5">
    Autonomous Web &amp; AI Systems • High-Performance Digital Architectures
  </text>

  <!-- Right Side Cyber Node -->
  <g filter="url(#badgeGlow)">
    <polygon points="568,28 572,23 576,28 572,33" fill="#C084FC"/>
  </g>
</svg>
